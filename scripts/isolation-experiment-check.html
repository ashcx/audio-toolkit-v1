<!doctype html><meta charset="utf-8"><title>Isolation experiments</title>
<h1>Isolation experiments</h1><p>Local, bounded diagnostics. Production defaults remain unchanged. 19-second comparison and 92-second full-song fixtures. Five interleaved warm runs per comparison variant. Twenty-minute comparison deadline.</p>
<button id="shapes">Check 15 and 22 second model windows</button><button id="run">Run isolation comparison</button><button id="cancel">Cancel</button><button id="long">Run full instrumental reliability</button><button id="cancel-check">Check cancellation after retained window</button>
<p id="status">Ready</p><div id="outputs"></div><pre id="result">{}</pre>
<script type="module">
import {inspectMedia,createFileId} from '../src/media.ts';
import {recipeSchema,newStep,snapshotForFile} from '../src/recipe.ts';
import {compilePlan} from '../src/planner.ts';
import {processAudio} from '../src/process-audio.ts';
const profiles=[{id:'baseline',overlap:.5,workerWindows:1},{id:'overlap55',overlap:.55,workerWindows:1},{id:'reuse2',overlap:.5,workerWindows:2},{id:'overlap55-reuse2',overlap:.55,workerWindows:2}];
const records=[],failures=[],outputs=new Map();let current=null,shapeResult=null,cancellationResult=null,cancellationStarted=0,cancellationActiveBefore=0,trace=[],active=0,maxActive=0;
const original=window.Worker;
window.Worker=new Proxy(original,{construct(target,args){const worker=Reflect.construct(target,args);if(args[1]?.name==='audio-isolation'){active++;maxActive=Math.max(maxActive,active);const id=crypto.randomUUID();trace.push({kind:'created',id,at:performance.now()});worker.addEventListener('message',({data})=>{if(data.kind!=='done')trace.push({...data,id,at:performance.now()});else trace.push({kind:'done',id,at:performance.now()});});let stopped=false;const terminate=worker.terminate.bind(worker);worker.terminate=()=>{if(!stopped){stopped=true;active--;trace.push({kind:'terminated',id,at:performance.now()});}return terminate();};}return worker;}});
const render=(status)=>{document.querySelector('#status').textContent=status;document.querySelector('#result').textContent=JSON.stringify({status,userAgent:navigator.userAgent,shapeResult,cancellationResult,active,maxActive,records,failures},null,2);};
function link(id,file){const previous=outputs.get(id);if(previous)URL.revokeObjectURL(previous);const url=URL.createObjectURL(file);outputs.set(id,url);let a=document.querySelector(`[data-output="${id}"]`);if(!a){a=document.createElement('a');a.dataset.output=id;a.style.display='block';document.querySelector('#outputs').append(a);}a.href=url;a.download=id==='source'?file.name:id+'.wav';a.textContent='Download '+id;}
async function input(fixture){const response=await fetch('/audio-toolkit-v1/fixtures/'+fixture+'.ogg');if(!response.ok)throw Error('Fixture HTTP '+response.status);const file=new File([await response.blob()],fixture+'.ogg'),inspection=await inspectMedia(file,new AbortController().signal);if(inspection.kind!=='ready')throw Error(inspection.message);return{file,inspection};}
async function remainingStorageFiles(){const root=await navigator.storage.getDirectory();try{const directory=await root.getDirectoryHandle('audio-toolkit-v1');let count=0;for await(const entry of directory.values())count++;return count;}catch(error){if(error.name==='NotFoundError')return 0;throw error;}}
async function runCase(source,profile,round,keep='music',cancelAfterFirst=false){
 trace=[];const events=[];current=new AbortController();const deadline=setTimeout(()=>current?.abort(new Error('Case exceeded 180 second limit')),180000);
 const recipe=recipeSchema.parse({version:1,steps:[{...newStep('isolation'),keep}],export:{format:'wav'}}),snapshot=snapshotForFile(recipe,{id:createFileId(),file:source.file,inspection:source.inspection});if(snapshot.kind!=='ready')throw Error(snapshot.message);const plan=compilePlan(snapshot.snapshot,source.inspection.metadata);if(plan.kind!=='pcm')throw Error('Not PCM');
 let output,record;const begin=performance.now();
 try{
  render('Running '+profile.id+' round '+round+' '+keep);
  output=await processAudio(source.file,plan,current.signal,profile.id+'.wav',event=>{events.push({...event,atMs:performance.now()-begin});if(cancelAfterFirst&&event.kind==='isolation-progress'&&event.completed===1){cancellationStarted=performance.now();cancellationActiveBefore=active;current.abort(new DOMException('Cancelled','AbortError'));}document.querySelector('#status').textContent='Running '+profile.id+' round '+round+' '+keep+' '+(event.kind==='isolation-progress'?event.completed+'/'+event.total:'');},{isolation:profile});
  const processingMs=performance.now()-begin,context=new AudioContext({sampleRate:44100});let decoded;
  try{decoded=await context.decodeAudioData(await output.output.file.arrayBuffer());}finally{await context.close();}
  const planes=Array.from({length:decoded.numberOfChannels},(_,i)=>decoded.getChannelData(i));let energy=0,peak=0,count=0;
  for(const plane of planes)for(const value of plane){if(!Number.isFinite(value))throw Error('Nonfinite output');energy+=value*value;peak=Math.max(peak,Math.abs(value));count++;}
  if(!energy||decoded.sampleRate!==source.inspection.metadata.sampleRate||decoded.numberOfChannels!==source.inspection.metadata.channels||decoded.length!==Math.round(source.inspection.metadata.duration*decoded.sampleRate))throw Error('Invalid output grid or silence');
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await output.output.file.arrayBuffer())),x=>x.toString(16).padStart(2,'0')).join('');
  const done=trace.filter(e=>e.kind==='done').length,loads=trace.filter(e=>e.kind==='created').length;
  if(active!==0||maxActive!==1||done!==output.stats.isolationWindows||loads!==output.stats.isolationLoads)throw Error('Worker accounting mismatch');
  record={profile:profile.id,round,keep,processingMs,validationMs:performance.now()-begin-processingMs,frames:decoded.length,channels:decoded.numberOfChannels,rate:decoded.sampleRate,rms:Math.sqrt(energy/count),peak,sha256:hash,stats:output.stats,events,trace:trace.map(e=>({...e,at:e.at-begin}))};
  records.push(record);if(round===0||round===1)link(profile.id+'-'+keep,output.output.file);
  render('Completed '+profile.id+' round '+round);
 }finally{clearTimeout(deadline);if(output)await output.output.release();if(record){record.storageFilesAfterRelease=await remainingStorageFiles();if(record.storageFilesAfterRelease!==0)throw Error('Temporary storage remains after release');}current=null;}
}
document.querySelector('#shapes').onclick=()=>{const worker=new Worker(new URL('../probes/isolation-shape-worker.ts',import.meta.url),{type:'module'});render('Checking fixed model shape');worker.onmessage=({data})=>{shapeResult=data;worker.terminate();render('Model shape checked');};worker.onerror=e=>{failures.push(String(e.message));worker.terminate();render('Model shape failed');};worker.postMessage({});};
document.querySelector('#cancel').onclick=()=>current?.abort(new DOMException('Cancelled','AbortError'));
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;const start=performance.now();try{const source=await input('live');link('source',source.file);await runCase(source,profiles[0],0);for(let round=1;round<=5;round++){const order=round%2?profiles:[...profiles].reverse();for(const profile of order){if(performance.now()-start>1200000)throw Error('Suite exceeded 20 minute limit');await runCase(source,profile,round);}}await runCase(source,profiles[2],1,'voice');render('Passed comparison');}catch(error){failures.push(String(error));render('Failed comparison');}finally{button.disabled=false;}};
document.querySelector('#cancel-check').onclick=async()=>{try{await runCase(await input('live'),profiles[2],0,'music',true);throw Error('Cancellation did not interrupt processing');}catch(error){if(error.name!=='AbortError'){failures.push(String(error));render('Failed cancellation');return;}cancellationResult={cancelled:true,completedWindows:1,retainedWorkerActiveBeforeAbort:cancellationActiveBefore,delayMs:performance.now()-cancellationStarted,active,storageFilesAfterRelease:await remainingStorageFiles()};if(active||cancellationResult.storageFilesAfterRelease||cancellationActiveBefore!==1){failures.push('Cancellation left resources');render('Failed cancellation');}else render('Passed retained-worker cancellation');}};
document.querySelector('#long').onclick=async()=>{try{const source=await input('instrumental');for(const profile of [profiles[0],profiles[2]])await runCase(source,profile,0);render('Passed full-song reliability');}catch(error){failures.push(String(error));render('Failed full-song reliability');}};
</script>
