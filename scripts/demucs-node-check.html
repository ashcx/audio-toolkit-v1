<!doctype html><meta charset="utf-8"><title>Demucs node bisection</title>
<h1>Demucs node bisection</h1><p>Diagnostic copies of htdemucs_fp16.onnx with intermediate outputs, compared with native ORT fingerprints. Not the pinned model; never shipped.</p>
<p id="status">Ready</p><pre id="result">{}</pre>
<script type="module">
import {load} from '../vendor/neural/neural.js';
const params=new URLSearchParams(location.search),provider=params.get('provider')??'wasm',name=params.get('fixture')??'tiny';
const root=new URL('../.artifacts/sprint-27/',location.href),vendor=new URL('../vendor/neural/',location.href);
const result={provider,fixture:name,nodes:[]};
const show=status=>{document.querySelector('#status').textContent=status;document.querySelector('#result').textContent=JSON.stringify({...result,nodes:result.nodes.length},null,2);};
const flat=async path=>new Float32Array(await (await fetch(new URL(path,root))).arrayBuffer());
try{
 const expected=await (await fetch(new URL(`nodes/${name}.nodes.json`,root))).json();
 const feeds={spec_real:{data:await flat(`tensors/${name}.spec_real.f32`),dims:[1,2,2048,336],type:'float32'},spec_imag:{data:await flat(`tensors/${name}.spec_imag.f32`),dims:[1,2,2048,336],type:'float32'},audio:{data:await flat(`tensors/${name}.audio.f32`),dims:[1,2,343980],type:'float32'}};
 for(const batch of expected.batches){
  show('Running '+batch.file);
  const bytes=new Uint8Array(await (await fetch(new URL(`nodes/${batch.file}`,root))).arrayBuffer());
  const session=await load(bytes,{backend:provider,executionProviders:[provider],wasmPaths:vendor.href,threads:1,sessionOptions:{enableCpuMemArena:false,enableMemPattern:false}});
  const outputs=await session.run(feeds,batch.nodes.map(node=>node.name));
  for(const node of batch.nodes){
   const raw=outputs[node.name].data,data=raw instanceof BigInt64Array?Float64Array.from(raw,Number):raw,count=node.samples.length;let signal=0,noise=0,maxAbs=0;
   for(let k=0;k<count;k++){const i=count===1?0:Math.floor(k*(data.length-1)/(count-1)),d=data[i]-node.samples[k];signal+=node.samples[k]**2;noise+=d*d;maxAbs=Math.max(maxAbs,Math.abs(d));}
   result.nodes.push({name:node.name,op:node.op,shape:node.shape,rms:node.rms,maxAbs,snrDb:noise?10*Math.log10(signal/noise):Infinity});
  }
  session.free();
 }
 result.done=true;show('Done');
}catch(error){result.error=String(error?.stack??error);show('Failed');}
window.__demucs=result;
</script>
